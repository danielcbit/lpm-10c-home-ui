name: Release

# Push a tag such as v1.0.0 whose section exists in CHANGELOG.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - id: setup
        uses: ./.github/actions/setup
        with:
          vendor-zip-url: ${{ vars.VENDOR_ZIP_URL || 'https://www.fnirsi.com.cn/uploads/file1/20261010/d68467f735b832bc57860df7f230ada41791625743186.zip' }}

      - name: Require the vendor image
        if: steps.setup.outputs.vendor != 'true'
        run: |
          echo "::error::The official FNIRSI update could not be fetched; set the repository variable VENDOR_ZIP_URL to its current URL"
          exit 1

      - name: Tests
        run: make test CC=clang PYTHON=python

      - name: Build and make the patch
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          python scripts/build_patched_image.py home-ui
          mkdir -p dist
          python scripts/lpm_patch.py make firmware/extracted/LPM-10C/LPM-10C_V2.0.7/LPM-10C_TX_V2.0.7_260907.bin \
            firmware/patched/home-ui/LPM-10C_TX_V2.0.7_260907.bin "dist/lpm-10c-home-ui-${tag}.patch.json" --name "$tag"
          cp scripts/lpm_patch.py LICENSE NOTICE dist/
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Release notes
        run: python scripts/release_notes.py "${GITHUB_REF_NAME}" > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file notes.md
